services:
  - type: web
    name: packetpulse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-minimal.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: web
    name: packetpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: packetpulse-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
